<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/gift.png" type="image/x-icon">
  <link rel="stylesheet" href="css/index.css">

  <!-- Document Title -->
  <title>holaaa</title>

  <style>
    .snoopy {
      position: absolute;
      width: 100px;
      z-index: 1;
      animation: floatAround 10s infinite ease-in-out alternate;
    }

    .snoopy1 {
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }

    .snoopy2 {
      top: 40%;
      left: 70%;
      animation-delay: 2s;
    }

    .snoopy3 {
      top: 70%;
      left: 30%;
      animation-delay: 4s;
    }

    @keyframes floatAround {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }

      25% {
        transform: translate(30px, -20px) rotate(10deg);
      }

      50% {
        transform: translate(-20px, 20px) rotate(-10deg);
      }

      75% {
        transform: translate(20px, -10px) rotate(5deg);
      }

      100% {
        transform: translate(0, 0) rotate(0deg);
      }
    }
  </style>
</head>

<body>
  <!-- Background -->
  <div class="night"></div>
  <div class="intro-decor" aria-hidden="true">
    <span class="intro-star" style="--x: 18%; --y: 12%; --delay: 0s">✦</span>
    <span class="intro-star" style="--x: 37%; --y: 20%; --delay: 1.4s">✧</span>
    <span class="intro-star" style="--x: 76%; --y: 15%; --delay: 0.7s">✦</span>
    <span class="intro-star" style="--x: 88%; --y: 38%; --delay: 2s">✧</span>
    <span class="intro-star" style="--x: 9%; --y: 47%; --delay: 0.4s">✦</span>
    <span class="intro-star" style="--x: 24%; --y: 63%; --delay: 1.8s">✧</span>
    <span class="intro-star" style="--x: 73%; --y: 68%; --delay: 1s">✦</span>
    <span class="intro-star" style="--x: 86%; --y: 87%; --delay: 2.5s">✧</span>
    <span class="intro-star" style="--x: 42%; --y: 90%; --delay: 0.8s">✦</span>
    <span class="intro-star" style="--x: 57%; --y: 8%; --delay: 1.6s">✧</span>
    <span class="intro-balloon intro-balloon--1"></span>
    <span class="intro-balloon intro-balloon--2"></span>
    <span class="intro-balloon intro-balloon--3"></span>
    <span class="intro-balloon intro-balloon--4"></span>
  </div>

  <!-- Animated Snoopy Images -->
  <img src="images/snoopy1.gif" alt="Snoopy" class="snoopy snoopy1">
  <img src="images/snoopy2.gif" alt="Snoopy" class="snoopy snoopy2">
  <img src="images/snoopy3.gif" alt="Snoopy" class="snoopy snoopy3">

  <!-- Title -->
  <h1 class="title"></h1>

  <!-- Button -->
  <div class="intro-actions">
    <div class="paw-trail" aria-hidden="true">
      <span class="intro-paw" style="--x: 5%; --y: 90%; --tilt: 28deg"></span>
      <span class="intro-paw" style="--x: 28%; --y: 68%; --tilt: 40deg"></span>
      <span class="intro-paw" style="--x: 40%; --y: 43%; --tilt: 22deg"></span>
      <span class="intro-paw" style="--x: 65%; --y: 24%; --tilt: 48deg"></span>
      <span class="intro-paw" style="--x: 82%; --y: 2%; --tilt: 36deg"></span>
    </div>
    <a href="flower.html" class="btn" aria-label="Abrir tu regalo de cumpleaños">
      <span class="gift-box" aria-hidden="true"></span>
      <span class="gift-lid" aria-hidden="true"></span>
      <span class="gift-bow" aria-hidden="true"></span>
      <span class="text">ABRE</span>
    </a>
    <p class="intro-hint">Toca el regalo, hay una sorpresa para ti</p>
  </div>

  <script src="js/ambience.js"></script>
  <script src="js/index.js"></script>
</body>

</html>
